# Local PostgreSQL for development. Credentials are for local use only.
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: vocaforge
      POSTGRES_PASSWORD: vocaforge
      POSTGRES_DB: vocaforge
    ports: ["5432:5432"]
    volumes: ["vocaforge-pg:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vocaforge"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  vocaforge-pg:
