name: ci
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env: { POSTGRES_USER: vocaforge, POSTGRES_PASSWORD: vocaforge, POSTGRES_DB: vocaforge_test }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U vocaforge" --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://vocaforge:vocaforge@localhost:5432/vocaforge_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test
      - run: npm run test:db
      - run: npm run build
